# This is a Databricks asset bundle definition for simple_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: simple_dab
  uuid: e85e9b70-06df-4aa9-b6b1-4296070ebe66

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405616066340184.4.azuredatabricks.net
    variables:
      catalog: dev
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405616066340184.4.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/jambalesourabh1@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jambalesourabh1@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev
      schema: prod
    permissions:
      - user_name: jambalesourabh1@gmail.com
        level: CAN_MANAGE
