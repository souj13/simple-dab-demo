resources:
  jobs:
    process_emp_date_by_dept:
      name: process_emp_date_by_dept
      tasks:
        - task_key: 01_set_day
          disabled: false
          email_notifications: {}
          environment_key: 01_set_day_environment
          notebook_task:
            base_parameters:
              input_date: '{{job.start_time.iso_datetime}}'
            notebook_path: ../src/01_get_run_dry.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: check_day
          depends_on:
            - task_key: 01_set_day
          condition_task:
            left: '{{tasks.01_set_day.values.input_day}}'
            op: EQUAL_TO
            right: Sun
          disabled: false
          email_notifications: {}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: 02_process_data
          depends_on:
            - outcome: "true"
              task_key: check_day
          disabled: false
          email_notifications: {}
          for_each_task:
            inputs: '["sales","office","production"]'
            task:
              disabled: false
              email_notifications: {}
              notebook_task:
                base_parameters:
                  dept: '{{input}}'
                notebook_path: /Workspace/Users/jambalesourabh1@gmail.com/workflows/01_process_emp_data_by_dept/02_ Write_Emp_Data
                source: WORKSPACE
              run_if: ALL_SUCCESS
              task_key: 02_process_data_iteration
              timeout_seconds: 0
              webhook_notifications: {}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
        - task_key: 03_else_condition
          depends_on:
            - outcome: "false"
              task_key: check_day
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/03_else_condition.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      email_notifications:
        no_alert_for_skipped_runs: false
      environments:
        - environment_key: 01_set_day_environment
          spec:
            environment_version: "5"
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
